name: Refresh OpenIPF data

# Weekly refresh of the OpenIPF bulk export.
#
# What this does:
#   1. Downloads the latest openipf-latest.zip from openpowerlifting.gitlab.io
#   2. Unzips and finds the dated CSV inside
#   3. Runs preprocess.py to produce openipf.parquet and qt_standards.parquet
#   4. Publishes both parquet files as a GitHub Release tagged "data-YYYY-MM-DD"
#      AND updates the rolling "data-latest" release to point at the newest files
#   5. Regenerates frontend/public/sitemap*.xml from the fresh parquet and,
#      when they changed, opens an auto-merging PR so Vercel redeploys with a
#      sitemap covering every athlete and meet page.
#
# The backend reads OPENIPF_PARQUET_URL and QT_PARQUET_URL env vars, both
# pointing at the "data-latest" release assets, so a fresh container always
# pulls the most recent snapshot.

on:
  schedule:
    # Sundays at 06:13 UTC. Off the top-of-hour to be polite to GitLab.
    - cron: "13 6 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write   # sitemap refresh opens + auto-merges a PR

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Needed by the sitemap commit step below.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Download openipf-latest.zip
        run: |
          mkdir -p /tmp/openipf
          curl -L --fail -o /tmp/openipf/openipf-latest.zip \
            https://openpowerlifting.gitlab.io/opl-csv/files/openipf-latest.zip
          ls -lh /tmp/openipf

      - name: Unzip and locate CSV
        id: locate
        run: |
          cd /tmp/openipf
          unzip -q openipf-latest.zip
          CSV_PATH=$(find . -name "openipf-*.csv" | head -n1)
          if [ -z "$CSV_PATH" ]; then
            echo "ERROR: no openipf-*.csv found in zip"
            exit 1
          fi
          ABS_CSV=$(realpath "$CSV_PATH")
          echo "csv_path=$ABS_CSV" >> "$GITHUB_OUTPUT"
          echo "Found CSV: $ABS_CSV"
          ls -lh "$ABS_CSV"

      - name: Run preprocess
        env:
          OPENIPF_CSV: ${{ steps.locate.outputs.csv_path }}
        run: |
          python data/preprocess.py
          ls -lh data/processed

      - name: Compute release tag
        id: tag
        run: |
          TAG="data-$(date -u +%Y-%m-%d)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"

      - name: Publish dated release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            Automated weekly OpenIPF data refresh.
            Source: https://openpowerlifting.gitlab.io/opl-csv/files/openipf-latest.zip
          files: |
            data/processed/openipf.parquet
            data/processed/qt_standards.parquet
            data/processed/athlete_projection_tables.json

      - name: Update rolling data-latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: data-latest
          name: data-latest
          body: |
            Rolling pointer at the most recent OpenIPF snapshot.
            Currently: ${{ steps.tag.outputs.tag }}
          files: |
            data/processed/openipf.parquet
            data/processed/qt_standards.parquet
            data/processed/athlete_projection_tables.json

      # Sitemaps ship as static files on Vercel rather than from a backend
      # endpoint: Render's free tier can take ~50 s to wake and a crawler
      # gives up long before that. Runs after the release upload so a failed
      # publish does not leave a sitemap advertising data that never shipped.
      - name: Regenerate sitemaps
        run: python data/generate_sitemap.py

      # Opens a PR rather than pushing to main directly. main requires the
      # "Frontend (tsc + build)" and "Backend (pytest)" checks, and a direct
      # push of a brand-new commit has no passing checks yet, so GitHub
      # rejects it -- github-actions[bot] is not an admin and admins are the
      # only bypass configured. Auto-merge lands the PR the moment those two
      # checks go green, so this stays hands-off despite the extra hop.
      - name: Open sitemap refresh PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- frontend/public; then
            echo "Sitemaps unchanged; nothing to do."
            exit 0
          fi
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="chore/sitemap-$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add frontend/public/sitemap*.xml
          git commit -m "chore(seo): refresh sitemaps for $DATE data"
          git push -f -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(seo): refresh sitemaps for $DATE data" \
            --body "Automated by the weekly OpenIPF refresh. Regenerates frontend/public/sitemap*.xml so newly imported lifters and meets are crawlable. Auto-merges once CI is green." \
            || echo "PR already open for $BRANCH; reusing it."
          gh pr merge "$BRANCH" --auto --squash --delete-branch
